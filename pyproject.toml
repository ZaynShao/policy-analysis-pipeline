[project]
name = "zce-pipeline"
version = "0.1.0"
description = "政策分析 pipeline 工程仓"
requires-python = ">=3.9"
dependencies = ["pyyaml", "anthropic>=0.40", "psycopg2-binary>=2.9", "trafilatura", "beautifulsoup4", "requests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
